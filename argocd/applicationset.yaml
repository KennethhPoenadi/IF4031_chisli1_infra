apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: xops
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: dev
                  namespace: dev
                - env: prod
                  namespace: sistem-informasi-kebencanaan-bnpb
          - list:
              elements:
                - svc: store
                - svc: rabbitmq
                - svc: auth-service
                - svc: bmkg-mock
                - svc: pvmbg-mock
                - svc: aggregator
                - svc: client-facing-api
                - svc: notifier
                - svc: dashboard-updater
                - svc: situation-analyst
                - svc: sensor-pantai
  template:
    metadata:
      name: '{{.svc}}-{{.env}}'
    spec:
      project: default
      source:
        repoURL: __REPO_URL__
        targetRevision: main
        path: charts/microservice
        helm:
          releaseName: '{{.svc}}'
          ignoreMissingValueFiles: true
          valueFiles:
            - '../../envs/{{.env}}/{{.svc}}.yaml'
            - '../../envs/{{.env}}/tags/{{.svc}}.yaml'
          parameters:
            - name: image.repository
              value: '{{ if eq .svc "sensor-pantai" }}sustuna/sensor-pantai{{ else }}__IMAGE_REPO__{{ end }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
