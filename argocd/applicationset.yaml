apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: xops
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                # dev dinonaktifkan: satu node 8-11 GB tidak muat menampung dev dan prod sekaligus.
                # Demo M2 hanya membutuhkan prod. Aktifkan lagi dengan menghapus tanda komentar di bawah.
                # - env: dev
                #   namespace: dev
                - env: prod
                  namespace: sistem-informasi-kebencanaan-bnpb
          - list:
              elements:
                - svc: store
                - svc: rabbitmq
                - svc: auth-service
                - svc: bmkg-mock
                - svc: pvmbg-mock
                - svc: aggregator
                - svc: client-facing-api
                - svc: notifier
                - svc: dashboard-updater
                - svc: situation-analyst
                - svc: sensor-pantai
                - svc: satellite-ingestor
  template:
    metadata:
      name: '{{.svc}}-{{.env}}'
    spec:
      project: default
      source:
        repoURL: __REPO_URL__
        targetRevision: main
        path: charts/microservice
        helm:
          releaseName: '{{.svc}}'
          ignoreMissingValueFiles: true
          valueFiles:
            - '../../envs/{{.env}}/{{.svc}}.yaml'
            - '../../envs/{{.env}}/tags/{{.svc}}.yaml'
          parameters:
            - name: image.repository
              value: '{{ if eq .svc "sensor-pantai" }}sustuna/sensor-pantai{{ else }}__IMAGE_REPO__{{ end }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      # Jumlah replika diubah saat runtime (load test mengganti replika Aggregator 3 -> 5 -> 2 lewat HPA). Tanpa ini selfHeal
      # membatalkan perubahan itu dalam hitungan detik. HPA yang dibuat KEDA (ScaledObject) memakai grup yang sama.
      ignoreDifferences:
        - group: autoscaling
          kind: HorizontalPodAutoscaler
          jsonPointers:
            - /spec/minReplicas
            - /spec/maxReplicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
