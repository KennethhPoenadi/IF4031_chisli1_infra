stages: [validate, mirror, cluster, platform, policies, secrets, bootstrap, release, promote]

default:
  tags: [k8s-local]
  before_script:
    - source scripts/env.sh

variables:
  REQUIRE_CHART: "false"
  MIRROR_IMAGES: "mongo:7 rabbitmq:3-management"
  MIRROR_REPO: "docker.io/$DOCKERHUB_USERNAME/if4054-2026-t1-13523008-13523029-13523040"
  GITOPS_RUNNER_TAG: "gitlab--duo"
  GITOPS_IMAGE: "alpine:3.20"

.platform_rules: &platform_rules
  - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "pipeline"

.gitops_job:
  tags: [$GITOPS_RUNNER_TAG]
  image: $GITOPS_IMAGE
  before_script:
    - apk add --no-cache git bash

validate:
  stage: validate
  script:
    - ./scripts/validate.sh

mirror-images:
  stage: mirror
  script:
    - ./scripts/mirror-images.sh $MIRROR_IMAGES
  allow_failure: true
  rules: *platform_rules

cluster:
  stage: cluster
  resource_group: xops-cluster
  script:
    - ./scripts/cluster-up.sh
  rules: *platform_rules

platform:
  stage: platform
  resource_group: xops-cluster
  script:
    - ./scripts/platform.sh
  rules: *platform_rules

policies:
  stage: policies
  resource_group: xops-cluster
  script:
    - |
      if ls policies/kyverno/*.yaml >/dev/null 2>&1; then
        kubectl apply -f policies/kyverno/
      else
        echo "WARN: belum ada policy di policies/kyverno"
      fi
  rules: *platform_rules

secrets-dev:
  stage: secrets
  resource_group: xops-cluster
  environment:
    name: dev
    action: access
  script:
    - ./scripts/create-secrets.sh dev
  rules: *platform_rules

secrets-prod:
  stage: secrets
  resource_group: xops-cluster
  environment:
    name: prod
    action: access
  script:
    - ./scripts/create-secrets.sh prod
  rules: *platform_rules

bootstrap-argocd:
  stage: bootstrap
  resource_group: xops-cluster
  script:
    - ./scripts/bootstrap-argocd.sh
  rules: *platform_rules

release-dev:
  extends: .gitops_job
  stage: release
  resource_group: xops-release
  environment:
    name: dev
  script:
    - bash ./scripts/set-tags.sh dev "$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "web") && $IMAGE_TAG

release-prod:
  extends: .gitops_job
  stage: promote
  resource_group: xops-release
  environment:
    name: prod
  script:
    - |
      if [ -z "${PROD_APPROVER:-}" ]; then
        echo "ERROR: CI variable PROD_APPROVER belum diisi"; exit 1
      fi
      if [ "$GITLAB_USER_LOGIN" != "$PROD_APPROVER" ]; then
        echo "ERROR: hanya $PROD_APPROVER yang boleh menyetujui deploy ke prod"; exit 1
      fi
    - bash ./scripts/set-tags.sh prod
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "web")
      when: manual
      allow_failure: true
