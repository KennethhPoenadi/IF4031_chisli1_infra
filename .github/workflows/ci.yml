name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Runs on GitHub-hosted runners, so it is safe for pull requests. Everything below touches the
  # local cluster and runs only for main, on the self-hosted runner labelled k8s-local.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      # validate.sh runs the Kyverno CLI through Docker when it is not installed.
      - run: ./scripts/validate.sh

  mirror-images:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate]
    runs-on: [self-hosted, k8s-local]
    continue-on-error: true
    # The package is owned by the app repo, so grant this repo Write once under the package's
    # "Manage Actions access"; until then this job fails, which is tolerated (continue-on-error).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          MIRROR_REPO="$(./scripts/image-repo.sh)" ./scripts/mirror-images.sh $MIRROR_IMAGES
        env:
          MIRROR_IMAGES: "mongo:7 rabbitmq:3-management"
          APP_IMAGE_NAME: ${{ vars.APP_IMAGE_NAME }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}

  cluster:
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: [validate, mirror-images]
    runs-on: [self-hosted, k8s-local]
    concurrency:
      group: xops-cluster
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/cluster-up.sh

  platform:
    needs: [cluster]
    runs-on: [self-hosted, k8s-local]
    concurrency:
      group: xops-cluster
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/platform.sh

  policies:
    needs: [platform]
    runs-on: [self-hosted, k8s-local]
    concurrency:
      group: xops-cluster
      cancel-in-progress: false
    env:
      APP_IMAGE_NAME: ${{ vars.APP_IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-env
      - run: |
          test -n "$(find policies/kyverno -name '*.yaml' -print -quit)"
          export IMAGE_REPO="$(./scripts/image-repo.sh)"
          for policy in policies/kyverno/*.yaml; do
            sed "s|__IMAGE_REPO__|$IMAGE_REPO|g" "$policy" | kubectl apply -f -
          done
          kubectl wait --for=condition=Ready clusterpolicy --all --timeout=120s
          kubectl get clusterpolicy
          ./scripts/test-kyverno-admission.sh

  # One job per environment. Application secrets are not stored in GitHub: they live in
  # ~/.xops/<env>.env on the self-hosted runner (KEY=value lines, see scripts/secret-keys.txt, plus
  # REGISTRY_USER and REGISTRY_PASS for the image pull secret). The file stays outside the repo.
  secrets:
    needs: [policies]
    runs-on: [self-hosted, k8s-local]
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    concurrency:
      group: xops-cluster
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Create secrets from the runner's env file
        run: |
          file="$HOME/.xops/${{ matrix.env }}.env"
          [ -f "$file" ] || { echo "ERROR: $file tidak ditemukan di mesin runner" >&2; exit 1; }
          ENV_FILE="$file" ./scripts/create-secrets.sh ${{ matrix.env }}

  bootstrap-argocd:
    needs: [secrets]
    runs-on: [self-hosted, k8s-local]
    concurrency:
      group: xops-cluster
      cancel-in-progress: false
    env:
      APP_IMAGE_NAME: ${{ vars.APP_IMAGE_NAME }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/bootstrap-argocd.sh
