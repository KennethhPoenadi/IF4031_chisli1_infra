name: Release

# Rilis langsung ke prod: tidak ada tahap dev dan tidak ada persetujuan manual.
# `deploy-dev` tetap diterima sebagai nama event karena workflow aplikasi masih mengirim nama itu.
on:
  repository_dispatch:
    types: [deploy-dev, deploy-prod]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (commit SHA, 7-40 hex)
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: xops-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set prod image tags
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag || inputs.image_tag }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{7,40}$ ]] || { echo "ERROR: image_tag harus berupa SHA commit hex, dapat: '$IMAGE_TAG'" >&2; exit 1; }
          bash ./scripts/set-tags.sh prod "$IMAGE_TAG"
