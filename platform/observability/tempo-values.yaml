tempo:
  retention: 24h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
persistence:
  enabled: false

# Penempatan: di worker untuk membagi memori; node control sudah terpakai sekitar 80%.
nodeSelector:
  kubernetes.io/hostname: chisli-worker-1
