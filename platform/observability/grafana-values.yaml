admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

persistence:
  enabled: false

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 384Mi }

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
  auth.anonymous:
    enabled: false
  users:
    allow_sign_up: false
  server:
    root_url: http://grafana.localtest.me

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.localtest.me
  path: /

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: observability
  datasources:
    enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        jsonData:
          derivedFields:
            - name: Trace
              matcherRegex: '"trace_id":"(\w+)"'
              url: '$${__value.raw}'
              datasourceUid: tempo
              urlDisplayLabel: Buka trace
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            customQuery: true
            query: '{pod="$${__span.tags["k8s.pod.name"]}"} |= "$${__trace.traceId}"'
          nodeGraph:
            enabled: true
