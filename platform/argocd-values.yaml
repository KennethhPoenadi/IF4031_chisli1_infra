configs:
  params:
    server.insecure: true
  cm:
    application.resourceTrackingMethod: annotation
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "Ingress dilayani Traefik hostPort tanpa load balancer"
      return hs
    # HPA dan ScaledObject dibuat di sync-wave sebelum Deployment (agar lolos Kyverno require-hpa).
    # Target-nya belum ada saat itu, sehingga kondisi bawaan menandainya Degraded dan memblokir wave
    # berikutnya (deadlock). Anggap sehat; kesehatan workload dinilai dari Deployment itu sendiri.
    resource.customizations.health.autoscaling_HorizontalPodAutoscaler: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "HPA dianggap sehat; target dibuat di wave berikutnya"
      return hs
    resource.customizations.health.keda.sh_ScaledObject: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "ScaledObject dianggap sehat; target dibuat di wave berikutnya"
      return hs
dex:
  enabled: false
notifications:
  enabled: false
