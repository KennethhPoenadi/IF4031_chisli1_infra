# Kyverno ringan: seluruh policy di repo ini memvalidasi saat admission (failureAction: Enforce), sehingga
# hanya admission controller yang dibutuhkan. Reports, background, dan cleanup controller tidak dipakai
# (tidak ada policy generate/mutate-existing dan laporan policy tidak dikonsumsi), dan sebelumnya
# justru menjadi sumber I/O disk dan CPU yang tinggi di node tunggal.
reportsController:
  enabled: false
backgroundController:
  enabled: false
cleanupController:
  enabled: false
admissionController:
  container:
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 384Mi }
