image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: gitlab-registry

kind: Deployment

replicaCount: 1

automountServiceAccountToken: false

strategy:
  maxSurge: 1
  maxUnavailable: 0

pdb:
  enabled: true
  minAvailable: 1

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

service:
  port: 8080

env: {}
secretRefs: []
extraEnv: []
args: []
extraVolumes: []
extraVolumeMounts: []

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities: { drop: [ALL] }

tmpVolume: true

livenessProbe:
  httpGet: { path: /health, port: http }
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet: { path: /health, port: http }
  initialDelaySeconds: 3
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60

ingress:
  enabled: false
  className: traefik
  host: ""
  path: /

persistence:
  enabled: false
  size: 1Gi
  mountPath: ""
  storageClass: ""

networkPolicy:
  enabled: true
  ingressNamespace: traefik
  ingressController: false
  from: []
  to: []
