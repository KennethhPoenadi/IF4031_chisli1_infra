image:
  repository: ""
  # wajib diisi saat deploy (--set image.tag=<service>-<commit sha>), tidak ada default agar tidak jatuh ke :latest
  tag: ""
  pullPolicy: IfNotPresent
# dibuat create-secrets.sh; tidak masalah bila image publik
imagePullSecrets:
  - name: gitlab-registry

replicaCount: 1

service:
  port: 8080

env: {}
secretRefs: []
# Env mentah Kubernetes (secretKeyRef, $(VAR) untuk merakit URL). Ditulis sebelum envFrom.
extraEnv: []

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities: { drop: [ALL] }

tmpVolume: true

livenessProbe:
  httpGet: { path: /health, port: http }
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet: { path: /health, port: http }
  initialDelaySeconds: 3
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60

ingress:
  enabled: false
  className: traefik
  host: ""
  path: /
