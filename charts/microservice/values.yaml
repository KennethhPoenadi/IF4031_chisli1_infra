image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: registry-credentials

kind: Deployment

role: ""

replicaCount: 1

automountServiceAccountToken: false

strategy:
  # RollingUpdate atau Recreate. Recreate dipakai singleton yang tidak boleh berjalan
  # dua sekaligus (satellite-ingestor: feed hanya menerima satu koneksi per token).
  type: RollingUpdate
  maxSurge: 1
  maxUnavailable: 0

pdb:
  enabled: true
  minAvailable: 1

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

antiAffinity:
  enabled: false
  mode: required
  topologyKey: kubernetes.io/hostname

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

leaderElection:
  enabled: false

telemetry:
  enabled: true
  metricsPort: 9102
  namespace: observability
  otlpEndpoint: http://alloy.observability.svc:4318
  otlpPort: 4318
  traceSampleRatio: "1"

podReader:
  enabled: false

service:
  port: 8080
  headless: false
  # Port tambahan, misalnya management API RabbitMQ untuk scaler KEDA: [{name, port}]
  extraPorts: []

env: {}
secretRefs: []
extraEnv: []
args: []
extraVolumes: []
extraVolumeMounts: []

resources:
  requests: { cpu: 50m }
  limits: { cpu: 250m }

resourceClasses:
  aggregator: { requests: { memory: 256Mi }, limits: { memory: 512Mi } }
  store:      { requests: { memory: 512Mi }, limits: { memory: 1Gi } }
  broker:     { requests: { memory: 512Mi }, limits: { memory: 1Gi } }
  consumer:   { requests: { memory: 128Mi }, limits: { memory: 256Mi } }
  api:        { requests: { memory: 128Mi }, limits: { memory: 256Mi } }
  mock:       { requests: { memory: 64Mi },  limits: { memory: 128Mi } }
  sensor:     { requests: { memory: 128Mi }, limits: { memory: 256Mi } }
  other:      { requests: { memory: 128Mi }, limits: { memory: 256Mi } }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities: { drop: [ALL] }

tmpVolume: true

livenessProbe:
  httpGet: { path: /health, port: http }
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet: { path: /health, port: http }
  initialDelaySeconds: 3
  periodSeconds: 5

autoscaling:
  enabled: true
  # hpa: HPA berbasis CPU. keda: ScaledObject KEDA berbasis panjang antrean RabbitMQ
  # (Bonus M2: kapasitas yang menyesuaikan diri), menggantikan HPA chart karena KEDA
  # membuat HPA-nya sendiri dan dua HPA pada satu target saling bertabrakan.
  engine: hpa
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60
  keda:
    queueName: ""
    # Jumlah pesan antre yang ditanggung satu replika sebelum menambah replika.
    queueLength: 20
    pollingInterval: 5
    cooldownPeriod: 60
    # Secret berisi URL management API RabbitMQ (key: host), dibuat scripts/create-secrets.sh.
    hostSecret: rabbitmq-keda

ingress:
  enabled: false
  className: traefik
  host: ""
  path: /

persistence:
  enabled: false
  size: 1Gi
  mountPath: ""
  storageClass: ""

networkPolicy:
  enabled: true
  ingressNamespace: traefik
  ingressController: false
  from: []
  fromNamespaces: []
  to: []
  egressHTTPS: false
  # Ingress tambahan ke port lain: [{namespaces: [keda], port: 15672}]
  extraIngress: []
