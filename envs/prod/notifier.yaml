role: consumer

service:
  port: 8093

env:
  RABBITMQ_EXCHANGE: hazard_events
  NOTIFIER_QUEUE: notifier-queue
  NOTIFIER_BINDING_KEYS: "hazard.#"
  NOTIFIER_PREFETCH: "10"
  NOTIFIER_MIN_SEVERITY: WASPADA
  NOTIFIER_PROCESS_DELAY_MS: "0"
  NOTIFIER_HEALTH_PORT: "8093"

secretRefs: [app-secrets]

extraEnv:
  - name: RABBITMQ_USER
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_USER
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_PASSWORD
  - name: RABBITMQ_URL
    value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/
networkPolicy:
  from: []
  to: [rabbitmq]
