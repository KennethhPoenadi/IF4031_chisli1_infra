role: api

service:
  port: 8080

ingress:
  enabled: true
  host: api.prod.localtest.me

# Memori per pod dikunci Lampiran B (128Mi/256Mi), tetapi jumlah replika bebas. Uji 10.000 VU membuat satu replika OOMKilled pada
# batas 256Mi dan replika yang tersisa kebanjiran (46-56% gagal selama 20 detik). Lebih banyak replika membagi koneksi dan
# antrean admission, sehingga memori per pod turun.
autoscaling:
  minReplicas: 6
  maxReplicas: 10

env:
  # Batas lunak memori Go di bawah limit pod 256Mi: GC bekerja agresif sebelum OOMKilled.
  GOMEMLIMIT: "200MiB"
  CLIENT_API_PORT: "8080"
  AGGREGATOR_URL: http://aggregator:8090
  AUTH_SERVICE_URL: http://auth-service:8091
  AUTH_TOKEN_ISSUER: bnpb-auth
  # Batas tunggu harus lebih besar dari antrean sah di aggregator (permintaan serentak yang diizinkan / kapasitas): 2 x 200 = 400
  # serentak pada sekitar 200 rps = 2 detik. Dengan 1,5 detik, permintaan yang akan berhasil malah menjadi 503 saat beban tinggi.
  CLIENT_API_AGGREGATOR_TIMEOUT_MS: "5000"
  # Permintaan serentak yang diizinkan masuk ke aggregator harus mendekati kapasitasnya (sekitar 200 rps, target latensi 0,5 detik
  # = sekitar 100 serentak total = 50 per replika). Batas 200 per replika membuat Mongo kelebihan beban pada uji k6: satu operasi
  # lambat menandai unit mati dan memicu kegagalan berantai (shardstore: tidak ada unit yang terjangkau). Kelebihannya ditolak 429.
  CLIENT_API_MAX_INFLIGHT: "50"
  CLIENT_API_PRIORITY_RESERVED: "10"
  CLIENT_API_MAX_PRIORITY_QUEUED: "400"
  CLIENT_API_REVOCATION_POLL_MS: "1000"
  FIELD_REPORT_PUBLISH_TIMEOUT_MS: "2000"
  CLIENT_API_OPS_TIMEOUT_MS: "120000"

secretRefs: [app-secrets]

extraEnv:
  - name: RABBITMQ_USER
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_USER
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_PASSWORD
  - name: RABBITMQ_URL
    value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/
networkPolicy:
  ingressController: true
  from: []
  to: [aggregator, auth-service, rabbitmq]

# Probe liveness berbasis TCP dan sabar: di bawah beban 10.000 VU probe HTTP 1 detik gagal, atau pod yang baru lahir (menunggu
# auth-service) dimatikan kubelet sebelum sempat mendengarkan. Readiness tetap HTTP agar pod yang benar-benar sakit keluar dari endpoint.
livenessProbe:
  httpGet: null
  tcpSocket: { port: http }
  initialDelaySeconds: 40
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
readinessProbe:
  httpGet: { path: /health, port: http }
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 4
