role: aggregator

service:
  port: 8090

ingress:
  enabled: true
  host: ops.prod.localtest.me
  path: /dashboard

autoscaling:
  minReplicas: 3
  maxReplicas: 5
topologySpread:
  whenUnsatisfiable: DoNotSchedule
leaderElection:
  enabled: true
podReader:
  enabled: true

env:
  AGGREGATOR_PORT: "8090"
  MONGO_DB_NAME: bnpb_canonical
  MONGO_HAZARD_COLLECTION: hazard_events
  STORE_UNIT_NAMES: store-0,store-1,store-2
  STORE_REPLICATION_FACTOR: "2"
  # Cluster dua node saling terhubung lewat Tailscale di atas Wi-Fi dan NAT WSL: throughput antar-pod lintas node hanya
  # 14-22 Mbit/s dan RTT puncak > 80 ms. Pada pembacaan besar, 2-5 detik terlalu ketat: unit di node lain ditandai tidak
  # terjangkau sesaat dan memicu perbaikan (status partial).
  STORE_UNIT_TIMEOUT_MS: "15000"
  RABBITMQ_EXCHANGE: hazard_events
  RABBITMQ_EXCHANGE_TYPE: topic
  BMKG_BASE_URL: http://bmkg-mock:8081
  PVMBG_BASE_URL: http://pvmbg-mock:8082
  AGGREGATOR_POLL_INTERVAL_SECONDS: "5"
  AGGREGATOR_BMKG_TIMEOUT_MS: "2000"
  AGGREGATOR_PVMBG_TIMEOUT_MS: "4000"
  AGGREGATOR_PVMBG_STALE_AFTER_SECONDS: "30"
  AGGREGATOR_LEADER_ELECTION_ENABLED: "true"
  AGGREGATOR_LEADER_LEASE_NAME: aggregator-upstream-poller
  AGGREGATOR_LEADER_LEASE_DURATION_SECONDS: "15"
  AGGREGATOR_LEADER_RETRY_PERIOD_SECONDS: "5"
  AGGREGATOR_PANTAI_ENABLED: "true"
  PANTAI_BASE_URL: http://sensor-pantai:8080
  AGGREGATOR_PANTAI_TIMEOUT_MS: "1500"
  AGGREGATOR_PANTAI_POLL_INTERVAL_MS: "1000"
  AGGREGATOR_PANTAI_STALE_AFTER_SECONDS: "30"
  AGGREGATOR_PANTAI_STATION_CACHE_TTL_SECONDS: "300"
  AGGREGATOR_PANTAI_CIRCUIT_FAILURES: "3"
  AGGREGATOR_PANTAI_CIRCUIT_OPEN_SECONDS: "10"
  SITUATION_ANALYST_URL: http://situation-analyst:8094
  PVMBG_FIELD_ALIASES: ""
  PVMBG_FIELD_COERCE: ""
  DLQ_RETRY_INTERVAL_SECONDS: "5"
  FIELD_REPORTS_ENABLED: "true"
  FIELD_REPORT_PREFETCH: "20"
  FIELD_REPORT_PROCESS_DELAY_MS: "0"

secretRefs: [app-secrets]

extraEnv:
  # Batas lunak memori Go sedikit di bawah limit pod (512Mi, Lampiran B): GC bekerja lebih agresif sebelum
  # menyentuh batas, sehingga lonjakan sesaat (perbaikan, pemindaian) tidak berujung OOMKilled.
  - name: GOMEMLIMIT
    value: 400MiB
  - name: MONGO_ROOT_USERNAME
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: MONGO_ROOT_USERNAME
  - name: MONGO_ROOT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: MONGO_ROOT_PASSWORD
  - name: STORE_URI_TEMPLATE
    value: mongodb://$(MONGO_ROOT_USERNAME):$(MONGO_ROOT_PASSWORD)@%s.store:27017/?authSource=admin
  - name: RABBITMQ_USER
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_USER
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_PASSWORD
  - name: RABBITMQ_URL
    value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/

livenessProbe:
  httpGet: null
  tcpSocket: { port: http }
  initialDelaySeconds: 5
  periodSeconds: 10
networkPolicy:
  ingressController: true
  from: [client-facing-api, satellite-ingestor]
  to: [bmkg-mock, pvmbg-mock, sensor-pantai, store, rabbitmq, situation-analyst]
  kubernetesAPICIDRs: [10.96.0.1/32, 10.43.0.1/32]
  # Endpoint API server (setelah DNAT): jaringan docker kind, jaringan host-only node k3s, dan alamat Tailscale
  # Node A (100.66.57.46) yang dipakai sebagai node-ip pada cluster dua node.
  kubernetesAPINodeCIDRs: [172.20.0.0/16, 192.168.56.0/24, 100.66.57.46/32]
