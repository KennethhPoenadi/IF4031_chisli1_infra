role: aggregator

service:
  port: 8090

ingress:
  enabled: true
  host: ops.prod.localtest.me
  path: /dashboard

autoscaling:
  minReplicas: 3
  maxReplicas: 5
topologySpread:
  whenUnsatisfiable: DoNotSchedule
leaderElection:
  enabled: true
podReader:
  enabled: true

env:
  AGGREGATOR_PORT: "8090"
  MONGO_DB_NAME: bnpb_canonical
  MONGO_HAZARD_COLLECTION: hazard_events
  STORE_UNIT_NAMES: store-0,store-1,store-2
  STORE_REPLICATION_FACTOR: "2"
  STORE_UNIT_TIMEOUT_MS: "2000"
  RABBITMQ_EXCHANGE: hazard_events
  RABBITMQ_EXCHANGE_TYPE: topic
  BMKG_BASE_URL: http://bmkg-mock:8081
  PVMBG_BASE_URL: http://pvmbg-mock:8082
  AGGREGATOR_POLL_INTERVAL_SECONDS: "5"
  AGGREGATOR_BMKG_TIMEOUT_MS: "2000"
  AGGREGATOR_PVMBG_TIMEOUT_MS: "4000"
  AGGREGATOR_PVMBG_STALE_AFTER_SECONDS: "30"
  SITUATION_ANALYST_URL: http://situation-analyst:8094

secretRefs: [app-secrets]

extraEnv:
  - name: MONGO_ROOT_USERNAME
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: MONGO_ROOT_USERNAME
  - name: MONGO_ROOT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: MONGO_ROOT_PASSWORD
  - name: STORE_URI_TEMPLATE
    value: mongodb://$(MONGO_ROOT_USERNAME):$(MONGO_ROOT_PASSWORD)@%s.store:27017/?authSource=admin
  - name: RABBITMQ_USER
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_USER
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_PASSWORD
  - name: RABBITMQ_URL
    value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/

livenessProbe:
  httpGet: null
  tcpSocket: { port: http }
  initialDelaySeconds: 5
  periodSeconds: 10
networkPolicy:
  ingressController: true
  from: [client-facing-api]
  to: [bmkg-mock, pvmbg-mock, store, rabbitmq, situation-analyst]
