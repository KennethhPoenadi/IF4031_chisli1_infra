role: broker  # pemroses stream SSE: kelas "Broker atau pemroses stream" Lampiran B (512Mi/1Gi)

strategy:
  type: Recreate

# Satu-satunya pembaca feed (Recreate: tidak boleh ada dua instance). Bila pod berada di worker lalu worker mati, Kubernetes
# menunggu pod lama selesai sebelum membuat pengganti, dan itu tidak pernah terjadi selama node mati, sehingga pemroses berhenti.
# Spesifikasi hanya mematikan node worker, jadi pemroses diwajibkan berjalan di node control.
preferNode:
  enabled: true
  mode: required
  key: ingress-ready
  value: "true"

service:
  port: 8095

autoscaling:
  minReplicas: 1
  maxReplicas: 1
pdb:
  enabled: false

livenessProbe:
  httpGet: { path: /health, port: http }
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet: { path: /ready, port: http }
  initialDelaySeconds: 3
  periodSeconds: 5

env:
  SATELLITE_INGESTOR_PORT: "8095"
  SATELLITE_BASE_URL: https://satellite.naufarrel.dev
  # Batas keterlambatan (menit, waktu satelit). Tetapkan dari rekaman feed (cmd/record).
  SATELLITE_LATENESS_MINUTES: "360"
  SATELLITE_RETENTION_HOURS: "24"
  SATELLITE_HEARTBEAT_TIMEOUT_SECONDS: "30"
  SATELLITE_BATCH_MAX: "500"
  SATELLITE_BATCH_WAIT_MS: "250"
  AGGREGATOR_URL: http://aggregator:8090

extraEnv:
  - name: SATELLITE_TOKEN
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: SATELLITE_TOKEN
        optional: true
  - name: AGGREGATOR_API_KEY
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: AGGREGATOR_API_KEY

networkPolicy:
  from: []
  to: [aggregator]
  egressHTTPS: true
