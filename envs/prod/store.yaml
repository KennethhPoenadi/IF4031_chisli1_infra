role: store

kind: StatefulSet
replicaCount: 3

image:
  tag: mongo-7

service:
  port: 27017
  headless: true

autoscaling:
  enabled: false

podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

persistence:
  enabled: true
  size: 2Gi
  mountPath: /data/db

extraVolumes:
  - name: configdb
    emptyDir: {}
extraVolumeMounts:
  - name: configdb
    mountPath: /data/configdb

args: [mongod, --wiredTigerCacheSizeGB=0.25]

# Limit 500m membuat Mongo tercekik saat repair atau beban tulis tinggi: query kena timeout, unit ditandai
# tidak terjangkau, dan perbaikan membatalkan dirinya sendiri. CPU opsional menurut spec; memori tetap Lampiran B.
resources:
  requests: { cpu: 200m }
  limits: { cpu: 1500m }

extraEnv:
  - name: MONGO_INITDB_ROOT_USERNAME
    valueFrom:
      secretKeyRef: { name: app-secrets, key: MONGO_ROOT_USERNAME }
  - name: MONGO_INITDB_ROOT_PASSWORD
    valueFrom:
      secretKeyRef: { name: app-secrets, key: MONGO_ROOT_PASSWORD }

livenessProbe:
  httpGet: null
  tcpSocket: { port: http }
  initialDelaySeconds: 30
  periodSeconds: 20
readinessProbe:
  httpGet: null
  tcpSocket: { port: http }
  initialDelaySeconds: 15
  periodSeconds: 15
networkPolicy:
  from: [aggregator]
  to: []
antiAffinity:
  enabled: true
  mode: preferred
topologySpread:
  whenUnsatisfiable: DoNotSchedule
pdb:
  enabled: true
  minAvailable: 2

telemetry:
  enabled: false
