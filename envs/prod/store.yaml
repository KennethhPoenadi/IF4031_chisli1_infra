role: store

kind: StatefulSet
# Satu unit penyimpanan = satu pod MongoDB mandiri. Aggregator menyebarkan data ke seluruh unit dengan
# consistent hashing dan menyimpan dua salinan per event (RF=2), jadi dev cukup satu unit dan prod tiga unit.
replicaCount: 3

image:
  tag: mongo-7

service:
  port: 27017
  headless: true   # store-0.store, store-1.store, ... dipakai aggregator

autoscaling:
  enabled: false

podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

persistence:
  enabled: true
  size: 2Gi
  mountPath: /data/db

extraVolumes:
  - name: configdb
    emptyDir: {}
extraVolumeMounts:
  - name: configdb
    mountPath: /data/configdb

args: [mongod, --wiredTigerCacheSizeGB=0.25]

resources:
  requests: { cpu: 100m }
  limits: { cpu: 500m }

extraEnv:
  - name: MONGO_INITDB_ROOT_USERNAME
    valueFrom:
      secretKeyRef: { name: app-secrets, key: MONGO_ROOT_USERNAME }
  - name: MONGO_INITDB_ROOT_PASSWORD
    valueFrom:
      secretKeyRef: { name: app-secrets, key: MONGO_ROOT_PASSWORD }

livenessProbe:
  httpGet: null
  tcpSocket: { port: http }
  initialDelaySeconds: 30
  periodSeconds: 20
readinessProbe:
  httpGet: null
  tcpSocket: { port: http }
  initialDelaySeconds: 15
  periodSeconds: 15
networkPolicy:
  from: [aggregator]
  to: []
# Replika store tidak boleh berbagi node. `preferred` dipakai selama cluster belum punya >=3 node;
# ganti ke `required` setelah cluster multi-node siap agar satu node tidak pernah memegang dua unit.
antiAffinity:
  enabled: true
  mode: preferred
topologySpread:
  whenUnsatisfiable: DoNotSchedule
pdb:
  enabled: true
  minAvailable: 2
