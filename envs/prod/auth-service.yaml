role: api

service:
  port: 8091

ingress:
  enabled: true
  host: auth.prod.localtest.me

# Token diminta ulang tiap 60 detik oleh setiap klien aktif (10.000 VU = sekitar 170 permintaan/detik). Replika diperbanyak sebelum
# uji supaya HPA tidak menambah pod di tengah beban.
autoscaling:
  minReplicas: 4
  maxReplicas: 6

env:
  AUTH_PORT: "8091"
  AUTH_ACCESS_TTL_SECONDS: "60"
  AUTH_REFRESH_TTL_SECONDS: "600"
  AUTH_TOKEN_ISSUER: bnpb-auth

secretRefs: [app-secrets]
networkPolicy:
  ingressController: true
  from: [client-facing-api]
  to: []

# Probe liveness berbasis TCP dan sabar: di bawah beban 10.000 VU probe HTTP 1 detik gagal, atau pod yang baru lahir (menunggu
# auth-service) dimatikan kubelet sebelum sempat mendengarkan. Readiness tetap HTTP agar pod yang benar-benar sakit keluar dari endpoint.
livenessProbe:
  httpGet: null
  tcpSocket: { port: http }
  initialDelaySeconds: 40
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
readinessProbe:
  httpGet: { path: /health, port: http }
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 4
