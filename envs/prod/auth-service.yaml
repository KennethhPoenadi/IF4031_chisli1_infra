service:
  port: 8091

ingress:
  enabled: true
  host: auth.prod.localtest.me

env:
  AUTH_PORT: "8091"
  AUTH_ACCESS_TTL_SECONDS: "60"
  AUTH_REFRESH_TTL_SECONDS: "600"
  AUTH_TOKEN_ISSUER: bnpb-auth

secretRefs: [app-secrets]
networkPolicy:
  ingressController: true
  from: [client-facing-api]
  to: []
