role: mock

service:
  port: 8082

env:
  PVMBG_PORT: "8082"
  PVMBG_DELAY_MIN_MS: "500"
  PVMBG_DELAY_MAX_MS: "3000"
  PVMBG_SEED_COUNT: "20"
  PVMBG_GENERATION_INTERVAL_SECONDS: "10"
  PVMBG_RANDOM_SEED: "4031"
  PVMBG_ADMIN_TESTER_COMPAT: "true"

secretRefs: [app-secrets]
networkPolicy:
  from: [aggregator]
  fromNamespaces: [tester-agent]
  to: []

# Mock mensimulasikan satu sistem eksternal dengan state di memori. Beberapa replika memiliki data dan
# penomoran event masing-masing, sehingga polling lewat Service melihat data yang berbeda-beda dan ID
# event berulang. Satu replika membuat upstream konsisten.
autoscaling:
  minReplicas: 1
  maxReplicas: 1
pdb:
  enabled: false
