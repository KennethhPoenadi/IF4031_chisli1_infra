role: api

service:
  port: 8080

ingress:
  enabled: true
  host: api.dev.localtest.me

autoscaling:
  maxReplicas: 3

env:
  CLIENT_API_PORT: "8080"
  AGGREGATOR_URL: http://aggregator:8090
  AUTH_SERVICE_URL: http://auth-service:8091
  AUTH_TOKEN_ISSUER: bnpb-auth
  CLIENT_API_AGGREGATOR_TIMEOUT_MS: "1500"
  CLIENT_API_MAX_INFLIGHT: "200"
  CLIENT_API_PRIORITY_RESERVED: "20"
  CLIENT_API_MAX_PRIORITY_QUEUED: "400"
  CLIENT_API_REVOCATION_POLL_MS: "1000"
  FIELD_REPORT_PUBLISH_TIMEOUT_MS: "2000"
  CLIENT_API_OPS_TIMEOUT_MS: "120000"

secretRefs: [app-secrets]

extraEnv:
  - name: RABBITMQ_USER
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_USER
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_PASSWORD
  - name: RABBITMQ_URL
    value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/
networkPolicy:
  ingressController: true
  from: []
  to: [aggregator, auth-service, rabbitmq]
