role: mock

service:
  port: 8081

env:
  BMKG_PORT: "8081"
  BMKG_DELAY_MS: "100"
  BMKG_SEED_COUNT: "20"
  BMKG_GENERATION_INTERVAL_SECONDS: "10"
  BMKG_RANDOM_SEED: "4031"

secretRefs: [app-secrets]
networkPolicy:
  from: [aggregator]
  # Tester Agent memanggil endpoint admin mock dari namespace tester-agent.
  fromNamespaces: [tester-agent]
  to: []
