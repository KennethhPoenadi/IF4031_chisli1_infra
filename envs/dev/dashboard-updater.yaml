image:
  # TODO: ganti <dockerhub-user>; tag diisi deploy.sh (--set image.tag=dashboard-updater-<sha>)
  repository: <dockerhub-user>/if4054-2026-t1-13523008-13523029-13523040

service:
  port: 8092


env:
  RABBITMQ_EXCHANGE: hazard_events
  BINDING_KEY: "hazard.#"
  DASHBOARD_UPDATER_QUEUE: dashboard-updater-queue
  DASHBOARD_UPDATER_PREFETCH: "10"
  DASHBOARD_UPDATER_HEALTH_PORT: "8092"

# URL Mongo/RabbitMQ dirakit di extraEnv dari key MONGO_ROOT_*/RABBITMQ_* di app-secrets
secretRefs: [app-secrets]

extraEnv:
  - name: RABBITMQ_USER
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_USER
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_PASSWORD
  - name: RABBITMQ_URL
    value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/
