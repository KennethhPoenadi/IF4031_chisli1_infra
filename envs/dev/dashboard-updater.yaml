role: consumer

service:
  port: 8092

env:
  RABBITMQ_EXCHANGE: hazard_events
  BINDING_KEY: "hazard.#"
  DASHBOARD_UPDATER_QUEUE: dashboard-updater-queue
  DASHBOARD_UPDATER_PREFETCH: "10"
  DASHBOARD_UPDATER_HEALTH_PORT: "8092"

secretRefs: [app-secrets]

extraEnv:
  - name: RABBITMQ_USER
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_USER
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: RABBITMQ_PASSWORD
  - name: RABBITMQ_URL
    value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/
networkPolicy:
  from: []
  to: [rabbitmq]
