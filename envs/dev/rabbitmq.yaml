kind: StatefulSet
replicaCount: 1

image:
  tag: rabbitmq-3-management

service:
  port: 5672

autoscaling:
  enabled: false

podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

persistence:
  enabled: true
  size: 1Gi
  mountPath: /var/lib/rabbitmq

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 500m, memory: 512Mi }

extraEnv:
  - name: RABBITMQ_DEFAULT_USER
    valueFrom:
      secretKeyRef: { name: app-secrets, key: RABBITMQ_USER }
  - name: RABBITMQ_DEFAULT_PASS
    valueFrom:
      secretKeyRef: { name: app-secrets, key: RABBITMQ_PASSWORD }

livenessProbe:
  httpGet: null
  tcpSocket: { port: http }
  initialDelaySeconds: 30
  periodSeconds: 20
readinessProbe:
  httpGet: null
  tcpSocket: { port: http }
  initialDelaySeconds: 15
  periodSeconds: 15
networkPolicy:
  from: [aggregator, notifier, dashboard-updater]
  to: []
pdb:
  enabled: false
