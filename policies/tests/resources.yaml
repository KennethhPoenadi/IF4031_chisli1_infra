apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-zero-replicas
  namespace: dev
spec:
  replicas: 0
  selector:
    matchLabels: { app: bad-zero-replicas }
  template:
    metadata:
      labels: { app: bad-zero-replicas }
    spec:
      containers:
        - name: app
          image: __IMAGE_REPO__:app-abc12345
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
            limits: { cpu: 250m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deployment-security
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels: { app: bad-deployment-security }
  template:
    metadata:
      labels: { app: bad-deployment-security }
    spec:
      containers:
        - name: app
          image: __IMAGE_REPO__:app-abc12345
          securityContext:
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
            limits: { cpu: 250m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bad-hpa-min-replicas
  namespace: dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 0
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliant-deployment
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: compliant-deployment }
  template:
    metadata:
      labels: { app: compliant-deployment }
