---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: compliant-hpa
  namespace: dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: compliant-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
