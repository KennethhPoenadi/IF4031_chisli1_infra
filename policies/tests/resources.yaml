apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod
  namespace: dev
spec:
  containers:
    - name: app
      image: __IMAGE_REPO__:app-abc12345
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
      resources:
        limits: { cpu: 250m, memory: 128Mi }
      livenessProbe:
        httpGet: { path: /health, port: 8080 }
      readinessProbe:
        httpGet: { path: /health, port: 8080 }
---
