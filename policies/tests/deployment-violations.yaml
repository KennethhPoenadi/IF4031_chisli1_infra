apiVersion: apps/v1
kind: Deployment
metadata:
  name: violation-image
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: violation-image }
  template:
    metadata:
      labels: { app: violation-image }
    spec:
      containers:
        - name: app
          image: other/app:app-abc12345
          securityContext: { runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false }
          resources: { limits: { cpu: 250m, memory: 128Mi } }
          livenessProbe: { httpGet: { path: /health, port: 8080 } }
          readinessProbe: { httpGet: { path: /health, port: 8080 } }
---
