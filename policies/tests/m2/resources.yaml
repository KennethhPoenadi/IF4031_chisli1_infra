apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sts-default-class
  namespace: dev
  labels:
    role: store
spec:
  serviceName: sts-default-class
  replicas: 1
  selector:
    matchLabels: { app: sts-default-class }
  template:
    metadata:
      labels: { app: sts-default-class, role: store }
    spec:
      containers:
        - name: app
          image: __IMAGE_REPO__:app-abc12345
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sts-local-path
  namespace: dev
