apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-role-label
  annotations:
    policies.kyverno.io/title: Require Role Label
    policies.kyverno.io/description: >-
      Kontrak M2: setiap pod wajib berlabel `role` dengan salah satu nilai kelas komponen. Tester Agent
      menemukan sasaran gangguannya lewat label ini.
spec:
  background: true
  rules:
    - name: require-valid-role-label
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [dev, sistem-informasi-kebencanaan-bnpb]
      validate:
        failureAction: Enforce
        message: "Pod harus berlabel role dengan nilai aggregator, store, broker, consumer, api, mock, sensor, atau other."
        pattern:
          metadata:
            labels:
              role: "aggregator | store | broker | consumer | api | mock | sensor | other"
