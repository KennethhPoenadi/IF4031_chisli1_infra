apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-hpa
  annotations:
    policies.kyverno.io/title: Require HorizontalPodAutoscaler
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  rules:
    - name: require-hpa-for-deployment
      match:
        any:
          - resources:
              kinds: [Deployment]
              namespaces: [dev, sistem-informasi-kebencanaan-bnpb]
      # Aggregator boleh berjalan dengan jumlah replika tetap: load test M2 mengubahnya 3 -> 5 -> 2 secara
      # manual, dan HPA dengan minReplicas 3 akan menimpa perubahan itu.
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  role: aggregator
      context:
        - name: matchingHpas
          apiCall:
            urlPath: "/apis/autoscaling/v2/namespaces/{{ request.namespace }}/horizontalpodautoscalers"
            jmesPath: "items[?spec.scaleTargetRef.kind == 'Deployment' && spec.scaleTargetRef.name == '{{ request.object.metadata.name }}'] | length(@)"
      validate:
        failureAction: Enforce
        message: Every Deployment must be targeted by a HorizontalPodAutoscaler so it can scale up automatically.
        deny:
          conditions:
            all:
              - key: "{{ matchingHpas }}"
                operator: Equals
                value: 0
