apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-hpa
  annotations:
    policies.kyverno.io/title: Require HorizontalPodAutoscaler
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  rules:
    - name: require-hpa-for-deployment
      match:
        any:
          - resources:
              kinds: [Deployment]
              namespaces: [dev, prod]
      context:
        - name: matchingHpas
          apiCall:
            urlPath: "/apis/autoscaling/v2/namespaces/{{ request.namespace }}/horizontalpodautoscalers"
            jmesPath: "items[?spec.scaleTargetRef.kind == 'Deployment' && spec.scaleTargetRef.name == '{{ request.object.metadata.name }}'] | length(@)"
      validate:
        failureAction: Enforce
        message: Every Deployment must be targeted by a HorizontalPodAutoscaler so it can scale up automatically.
        deny:
          conditions:
            all:
              - key: "{{ matchingHpas }}"
                operator: Equals
                value: 0
